<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resumo da Consulta</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        .note-section { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="header">
    <h2>MedAgenda - Resumo de Atendimento Médico</h2>
    <p>ID da Consulta: <span th:text="${appointmentId}"></span></p>
</div>

<div>
    <p><strong>Paciente ID:</strong> <span th:text="${event.patientId()}"></span></p>
    <p><strong>Médico ID:</strong> <span th:text="${event.doctorId()}"></span></p>
</div>

<div th:each="note : ${event.clinicalNotes()}" class="note-section">
    <h3 th:text="${note.type()}">Tipo de Nota</h3>
    <p th:text="${note.content()}">Conteúdo da nota médica aqui...</p>
</div>

</body>
</html>
