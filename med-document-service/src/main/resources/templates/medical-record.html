<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prontuário Médico</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 40px; }
        .header { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 20px; }
        .document-title { font-size: 24px; color: #2c3e50; text-transform: uppercase; margin-bottom: 5px; }
        .info-section { margin-bottom: 30px; font-size: 14px; display: flex; justify-content: space-between; }
        .note-box { border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 15px; background-color: #fafafa; }
        .note-title { font-weight: bold; text-transform: uppercase; color: #2c3e50; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div class="document-title">Prontuário Clínico</div>
    <div>Atendimento nº: <span th:text="${appointmentId}"></span></div>
</div>

<div class="info-section">
    <p><strong>Paciente ID:</strong> <span th:text="${event.patientId()}"></span></p>
    <p><strong>Médico ID:</strong> <span th:text="${event.doctorId()}"></span></p>
</div>

<!-- Imprime todas as notas clínicas -->
<div th:each="note : ${event.clinicalNotes()}" class="note-box">
    <p class="note-title" th:text="${note.type()}"></p>
    <p th:text="${note.content()}"></p>
</div>

</body>
</html>
