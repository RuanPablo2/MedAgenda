<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Receituário</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 40px; }
        .page-break { page-break-after: always; }
        .page-break:last-child { page-break-after: auto; }

        .header { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 40px; }
        .document-title { font-size: 24px; color: #2c3e50; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .recipe-type { font-size: 14px; font-weight: bold; color: #7f8c8d; margin-bottom: 20px; }

        .content { font-size: 16px; line-height: 1.6; min-height: 300px; }
        .item-list { margin-top: 20px; padding-left: 20px; }
        .item-list li { margin-bottom: 10px; }
        .signature-box { margin-top: 80px; text-align: center; border-top: 1px solid #333; width: 300px; margin-left: auto; margin-right: auto; padding-top: 10px; }
    </style>
</head>
<body>

<div th:each="prescription : ${prescriptions}" class="page-break">
    <div class="header">
        <div class="document-title">Receituário Médico</div>
        <div class="recipe-type" th:text="${prescription.type() == 'COMMON' ? 'Via Comum' : 'Controle Especial'}"></div>
        <p>Paciente: <strong><span th:text="${event.patientName()}"></span></strong></p>
    </div>

    <div class="content">
        <h3>Uso do Paciente:</h3>
        <ul class="item-list">
            <li th:each="med : ${prescription.medications()}" th:text="${med}"></li>
        </ul>
    </div>

    <div class="signature-box">
        <p>Assinatura e Carimbo</p>
        <p><strong><span th:text="${event.doctorName()}"></span></strong><br/></p>
    </div>
</div>

</body>
</html>
