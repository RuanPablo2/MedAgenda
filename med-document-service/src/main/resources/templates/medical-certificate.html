<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Atestado Médico</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 50px; }
        .page-break { page-break-after: always; }
        .page-break:last-child { page-break-after: auto; }
        .header { text-align: center; margin-bottom: 50px; }
        .document-title { font-size: 24px; font-weight: bold; text-decoration: underline; }
        .content { font-size: 18px; line-height: 1.8; text-align: justify; }
        .signature-box { margin-top: 80px; text-align: center; border-top: 1px solid #333; width: 300px; margin-left: auto; margin-right: auto; padding-top: 10px; }
    </style>
</head>
<body>

<div th:each="cert : ${certificates}" class="page-break">
    <div class="header">
        <div class="document-title">ATESTADO MÉDICO</div>
    </div>

    <div class="content">
        <p>
            Atesto para os devidos fins que o paciente <strong><span th:text="${event.patientName()}"></span></strong> foi atendido nesta data e necessita de dispensa de suas atividades laborais por
            <strong><span th:text="${cert.days()}"></span> dias</strong>.
        </p>

        <p><strong>Motivo:</strong> <span th:text="${cert.reason()}"></span></p>
    </div>

    <div class="signature-box">
        <p>Assinatura e Carimbo</p>
        <p><strong><span th:text="${event.doctorName()}"></span></strong><br/></p>
    </div>
</div>

</body>
</html>
